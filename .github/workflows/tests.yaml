name: Tests

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_call:

env:
  GODOT_VERSION: 4.7.1

jobs:
  test:
    name: Rules, smoke and network tests
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: ${{ env.GODOT_VERSION }}
          use-dotnet: false
          include-templates: false

      # Same script the git hooks use (tests/run.sh); one step per suite for readable logs.
      - name: Import project
        run: sh tests/run.sh import

      - name: Unit tests (pure rules)
        run: sh tests/run.sh unit

      - name: Lobby navigation test
        run: sh tests/run.sh nav

      - name: Smoke test (host match)
        run: sh tests/run.sh smoke

      - name: Network test (host + client)
        run: sh tests/run.sh net
